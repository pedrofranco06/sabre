[project]
name = "sabre"
version = "0.1.0"
description = "SABRE — Sistema Automatizado de Busca e Resumo (case IEEE CEFET/RJ 2026.2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sabre = "sabre.__main__:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
